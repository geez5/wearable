; =============================================================
;  Project  : Kavach Safety Wristband
;  File     : platformio.ini
;
;  Stage 1 — Base config
;  Stage 2 — Library dependencies
; =============================================================

[platformio]
; 'pio run' and 'pio run --target upload' only build/flash esp32dev
default_envs = esp32dev

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
; Exclude test files from the main build
build_src_filter = +<*> -<.git/> -<oled_test.cpp>

; Libraries auto-installed on first build.
; NOTE: Using U8g2 — supports SSD1306, SH1106, and 40+ OLED controllers.
;       Replaces Adafruit SSD1306 which only works on genuine SSD1306 chips.
lib_deps =
    paulstoffregen/OneWire @ ~2.3.8
    milesburton/DallasTemperature @ ~3.11.0
    olikraus/U8g2 @ ~2.35.30
    oxullo/MAX30100lib @ ~1.2.1

; =============================================================
;  OLED-only test environment
;  Flash with:  pio run -e oled_test --target upload
;  Monitor with: pio device monitor
;  sketch.ino is NOT compiled in this env at all.
; =============================================================
[env:oled_test]
platform         = espressif32
board            = esp32dev
framework        = arduino
monitor_speed    = 115200
build_src_filter = -<*> +<oled_test.cpp>
lib_deps         = olikraus/U8g2 @ ~2.35.30
