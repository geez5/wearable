; =============================================================
;  Project  : Kavach Safety Wristband
;  File     : platformio.ini
;
;  Stage 1 — Base config
;  Stage 2 — Library dependencies
; =============================================================

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200

; Stage 2 — Libraries auto-installed on first build.
; Pinned to tested minor versions; patch updates are allowed (~).
lib_deps =
    paulstoffregen/OneWire @ ~2.3.8
    milesburton/DallasTemperature @ ~3.11.0
    adafruit/Adafruit SSD1306 @ ~2.5.7
    adafruit/Adafruit GFX Library @ ~1.11.9
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ~1.1.2
